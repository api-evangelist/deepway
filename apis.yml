aid: deepway
name: DeepWay 深向
description: >-
  DeepWay (深向科技 / Shenxiang Technology) is a Chinese intelligent new-energy
  heavy-truck company, backed by Baidu and Qiming Venture Partners, that designs
  and manufactures electric autonomous freight trucks it calls RoboTrucks. Its
  vehicle line includes the Xingchen II (深向星辰 II) and Xingtu (深向星途) electric
  heavy trucks paired with the Tianji (天玑) driver-assistance and autonomous
  driving stack, an AI-based fleet management platform, and a vehicle-owner
  mobile app. DeepWay reports 7,500+ activated L2 vehicles, a 30%+ subscription
  rate, and 300M+ km of assisted-driving operation, and follows a roadmap from
  L2 assistance (2023) to L4 platooning (2025) to single-vehicle L4 autonomy
  (2028). Its business model progresses from vehicle sales to subscription
  services to large-scale autonomous logistics capacity. As of this enrichment
  pass DeepWay publishes no public developer API, SDK, documentation portal, or
  machine-readable specification — this profile captures company identity and a
  domain-security probe only.
